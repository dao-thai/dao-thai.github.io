<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>JSON 생성기</title><style>body{margin:0;background:#f7f5fb;font-family:sans-serif;color:#211d2b}main{max-width:900px;margin:40px auto;padding:0 18px}a{color:#7158d7}section{margin:18px 0;padding:22px;background:#fff;border:1px solid #e8e2ef;border-radius:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:grid;gap:6px;font-weight:700}.wide{grid-column:1/-1}input,textarea{padding:11px;border:1px solid #e8e2ef;border-radius:10px}button{padding:11px 14px;border:0;border-radius:10px;background:#7158d7;color:#fff;font-weight:800}pre{white-space:pre-wrap;background:#f4f1fa;padding:16px;border-radius:12px;overflow:auto}@media(max-width:650px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><main><a href="./">← 사이트로</a><h1>JSON 뼈대 생성기</h1><section><div class="grid"><label>날짜<input id="date" type="date"></label><label>ID<input id="id" placeholder="2026-07-24-song"></label><label>곡명<input id="title"></label><label>가수<input id="artist"></label><label class="wide">YouTube<input id="youtube"></label><label class="wide">설명<textarea id="desc"></textarea></label><label class="wide">가사<textarea id="lyrics" rows="10" placeholder="한 줄에 한 문장"></textarea></label></div><p><button id="make">JSON 뼈대 만들기</button></p></section><section><button id="copy">결과 복사</button><textarea id="out" rows="22" style="width:100%;margin-top:12px"></textarea></section><section><button id="cp">ChatGPT 프롬프트 복사</button><pre id="prompt"></pre></section></main><script>const PROMPT="다음 태국어 노래 가사를 Dao Thai Study 사이트용 데이터로 분석해줘.\n\n반드시 설명 없이 유효한 JSON 객체 하나만 출력해.\n- 한 단어가 여러 음절이면 syllables 배열에서 음절별로 분리한다. 예: สุดท้าย → สุด / ท้าย\n- 각 음절: thai, reading, tone\n- tone 값: mid=평성, low=1성, falling=2성, high=3성, rising=4성\n- 독음은 실제 발음에 가깝게 적고 장모음 뒤에 -를 붙인다.\n- เธอ는 트ㅓ-, เลย는 르ㅓ이-, เคย는 크ㅓ이-처럼 적는다.\n- meaning은 단어·구절 뜻, natural은 자연스러운 문장 번역\n- studyNotes에는 성조 공식 대신 결합 의미, 문법, 유의어, 혼동어, 문맥 뉘앙스를 넣는다.\n- audio는 빈 문자열\n- 문장 id는 s1, s2 순서\n\n스키마:\n{\n \"id\":\"YYYY-MM-DD-song-title\",\"date\":\"YYYY-MM-DD\",\"title\":\"곡명\",\"artist\":\"가수\",\n \"youtube\":\"주소\",\"description\":\"선택 설명\",\"sentences\":[{\n  \"id\":\"s1\",\"thai\":\"원문\",\"audio\":\"\",\"natural\":\"번역\",\n  \"tokens\":[{\"meaning\":\"뜻\",\"syllables\":[{\"thai\":\"음절\",\"reading\":\"독음\",\"tone\":\"mid\"}]}],\n  \"studyNotes\":[\"학습 메모\"]\n }]\n}\n\n곡 정보와 가사:\n[여기에 붙여 넣기]";prompt.textContent=PROMPT;date.value=new Date().toISOString().slice(0,10);make.onclick=()=>{let lines=lyrics.value.split(/\n+/).map(v=>v.trim()).filter(Boolean);out.value=JSON.stringify({id:id.value||"YYYY-MM-DD-song",date:date.value,title:title.value,artist:artist.value,youtube:youtube.value,description:desc.value,sentences:lines.map((thai,i)=>({id:"s"+(i+1),thai,audio:"",natural:"",tokens:[{meaning:"",syllables:[{thai:"",reading:"",tone:"mid"}]}],studyNotes:[]}))},null,2)};copy.onclick=()=>navigator.clipboard.writeText(out.value);cp.onclick=()=>navigator.clipboard.writeText(PROMPT);</script></body></html>
